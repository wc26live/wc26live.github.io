<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Embedded Live TV</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;

        /* প্লেয়ারের সাইজ ও সুন্দর ফ্রেম তৈরি করার জন্য */

            border-radius: 8px;

        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="iframe-container">
        <iframe 
            src="http://103.165.93.31:8095/tsports/tracks-v1a1a2/mono.m3u8"

            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
